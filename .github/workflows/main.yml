name: Build All Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    name: Linux (deb + AppImage + rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libfuse2

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Build Linux packages
        run: npx tauri build --bundles deb,appimage,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK & SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066"
          yes | sdkmanager --licenses

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Init Android project
        env:
          ANDROID_HOME: $ANDROID_HOME
          NDK_HOME: $ANDROID_HOME/ndk/29.0.13846066
        run: npx tauri android init

      - name: Build APK
        env:
          ANDROID_HOME: $ANDROID_HOME
          NDK_HOME: $ANDROID_HOME/ndk/29.0.13846066
        run: npx tauri android build --apk --target aarch64 -- --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/arm64-v8a/release/*.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        shell: bash
        run: |
          mkdir -p public
          npm run build:public

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Build DMG
        run: npx tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

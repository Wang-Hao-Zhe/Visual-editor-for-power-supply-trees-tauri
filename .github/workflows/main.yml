name: Build All Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    name: Linux (deb + AppImage + rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libfuse2

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Build Linux packages
        run: npx tauri build --bundles deb,appimage,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK & SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066"
          yes | sdkmanager --licenses

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Init Android project
        env:
          ANDROID_HOME: $ANDROID_HOME
          NDK_HOME: $ANDROID_HOME/ndk/29.0.13846066
        run: npx tauri android init

      - name: Build APK
        env:
          ANDROID_HOME: $ANDROID_HOME
          NDK_HOME: $ANDROID_HOME/ndk/29.0.13846066
        run: npx tauri android build --apk --target aarch64 -- --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/arm64-v8a/release/*.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        shell: bash
        run: |
          mkdir -p public
          npm run build:public

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Build DMG
        run: npx tauri build --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  # ------------------------------------------------------------------
  # iOS IPA：需要 Apple 开发者证书和描述文件。
  # 没配 secret 时此 job 自动跳过。配好后再打开。
  # ------------------------------------------------------------------
  ios:
    name: iOS IPA
    runs-on: macos-latest
    if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: npm install
        run: npm install

      - name: Prepare static frontend
        run: |
          mkdir -p public
          npm run build:public

      - name: Install signing certificates
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Init iOS project
        run: npx tauri ios init

      - name: Build IPA
        run: npx tauri ios build --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            src-tauri/gen/apple/build/arm64/ios/*.ipa
            src-tauri/target/ios/*.ipa
